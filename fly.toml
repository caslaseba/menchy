app = "caslaseba-menchy"
primary_region = "eze"

[build]

[env]
  MENCHY_CLOUD = "1"
  MENCHY_NO_OPEN = "1"
  DATA_DIR = "/data"
  TZ = "America/Argentina/Buenos_Aires"
  PORT = "3847"

[http_service]
  internal_port = 3847
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[mounts]
  source = "menchy_data"
  destination = "/data"
